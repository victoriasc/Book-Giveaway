<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free to a good home — book giveaway</title>
  <meta name="description" content="Books I'm giving away, free to a good home.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <span class="eyebrow">Est. 2026 · Lending Nothing, Giving Everything</span>
    <h1>Free to a good home</h1>
    <p>A running list of books I've read, loved, and am passing along. Click a title for photos, condition, and whether it's still up for grabs.</p>
  </header>

  <main class="catalog">
    <div class="catalog-meta">
      <span>Catalog</span>
      <span id="catalog-count">Loading…</span>
      <label class="sort-control" for="sort-select">
        Sort by
        <select id="sort-select">
          <option value="title">Title (A–Z)</option>
          <option value="author">Author (last name A–Z)</option>
          <option value="availability">Availability</option>
        </select>
      </label>
    </div>
    <div class="tag-filters" id="tag-filters" hidden></div>
    <div class="catalog-grid" id="catalog-grid" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    Message me if you'd like something on this list.
  </footer>

  <script src="js/books-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
